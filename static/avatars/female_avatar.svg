<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" id="female-avatar-svg" class="corporate-avatar-svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="femBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Skin Base & Shading -->
    <linearGradient id="femSkinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fdf0e6"/>
      <stop offset="45%" stop-color="#f7dcce"/>
      <stop offset="100%" stop-color="#e8b99d"/>
    </linearGradient>
    <linearGradient id="femNeckShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cf9475"/>
      <stop offset="100%" stop-color="#e8b99d"/>
    </linearGradient>

    <!-- Hair Tone & Highlights -->
    <linearGradient id="femHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3528"/>
      <stop offset="50%" stop-color="#2d1e15"/>
      <stop offset="100%" stop-color="#1c120c"/>
    </linearGradient>
    <linearGradient id="femHairHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b4c38" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8c654d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6b4c38" stop-opacity="0"/>
    </linearGradient>

    <!-- Blazer & Attire -->
    <linearGradient id="femBlazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3b54"/>
      <stop offset="50%" stop-color="#222238"/>
      <stop offset="100%" stop-color="#121224"/>
    </linearGradient>
    <linearGradient id="femBlouseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadow Filter -->
    <filter id="femAvatarDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="200" height="240" rx="16" fill="url(#femBgGrad)"/>
  
  <!-- Subtle Studio Rim Light Glow -->
  <circle cx="100" cy="90" r="85" fill="#8b5cf6" opacity="0.08"/>

  <!-- Entire Character Group (for breathing respiration) -->
  <g id="avatar-character-body" class="avatar-character-body">

    <!-- Back Volume of Hair (Flowing behind shoulders) -->
    <path d="M 52 90 C 42 120 46 160 56 185 C 64 165 60 135 62 105 C 62 80 75 42 100 42 C 125 42 138 80 138 105 C 140 135 136 165 144 185 C 154 160 158 120 148 90 Z" fill="url(#femHairGrad)"/>

    <!-- Shoulders & Tailored Blazer -->
    <g class="avatar-attire">
      <!-- Blazer Body / Base -->
      <path d="M 24 240 L 34 195 C 40 172 60 162 82 160 L 118 160 C 140 162 160 172 166 195 L 176 240 Z" fill="url(#femBlazerGrad)"/>

      <!-- Silk V-Neck Blouse -->
      <path d="M 84 160 L 100 190 L 116 160 C 110 160 90 160 84 160 Z" fill="url(#femBlouseGrad)"/>
      <path d="M 88 160 L 100 182 L 112 160" stroke="#cbd5e1" stroke-width="0.75" fill="none"/>

      <!-- Elegant Pearl Drop Necklace -->
      <path d="M 88 152 Q 100 172 112 152" stroke="#fcd34d" stroke-width="0.8" fill="none" opacity="0.85"/>
      <circle cx="100" cy="168" r="2.2" fill="#ffffff" stroke="#fcd34d" stroke-width="0.6"/>

      <!-- Blazer Lapels -->
      <!-- Left Lapel -->
      <path d="M 44 240 L 62 188 C 66 176 76 168 86 164 L 100 198 L 78 240 Z" fill="#303048"/>
      <!-- Right Lapel -->
      <path d="M 156 240 L 138 188 C 134 176 124 168 114 164 L 100 198 L 122 240 Z" fill="#202034"/>

      <!-- Lapel Accent Edge Line -->
      <path d="M 86 164 L 100 198 L 78 240" stroke="#475569" stroke-width="0.75" fill="none" opacity="0.4"/>
      <path d="M 114 164 L 100 198 L 122 240" stroke="#475569" stroke-width="0.75" fill="none" opacity="0.4"/>
    </g>

    <!-- Head & Facial Features Group (for head tilt / micro-nodding) -->
    <g id="avatar-head" class="avatar-head" transform-origin="100 120">

      <!-- Neck & Anatomical Shading -->
      <path d="M 88 130 L 88 160 C 92 164 108 164 112 160 L 112 130 Z" fill="url(#femNeckShadow)"/>
      <!-- Under-Jaw Shadow -->
      <path d="M 88 130 C 93 143 107 143 112 130 C 108 146 92 146 88 130 Z" fill="#b97c5c" opacity="0.45"/>

      <!-- Delicate Pearl Stud Earrings -->
      <!-- Left Ear & Earring -->
      <path d="M 66 98 C 61 98 61 114 67 115 C 68 110 68 103 66 98 Z" fill="#e8b99d"/>
      <circle cx="67.5" cy="113" r="2.2" fill="#ffffff" stroke="#fcd34d" stroke-width="0.6"/>
      <!-- Right Ear & Earring -->
      <path d="M 134 98 C 139 98 139 114 133 115 C 132 110 132 103 134 98 Z" fill="#e8b99d"/>
      <circle cx="132.5" cy="113" r="2.2" fill="#ffffff" stroke="#fcd34d" stroke-width="0.6"/>

      <!-- Face / Head Structure (Refined Jawline & Proportions) -->
      <path d="M 68 84 C 68 52 81 44 100 44 C 119 44 132 52 132 84 C 132 108 124 135 100 135 C 76 135 68 108 68 84 Z" fill="url(#femSkinGrad)" filter="url(#femAvatarDropShadow)"/>

      <!-- Subtle Executive Cheek Contour & Warm Blush -->
      <ellipse cx="78" cy="103" rx="7" ry="4" fill="#f43f5e" opacity="0.12"/>
      <ellipse cx="122" cy="103" rx="7" ry="4" fill="#f43f5e" opacity="0.12"/>
      <path d="M 69 86 C 70 106 78 123 98 133 C 86 125 76 108 74 88 Z" fill="#cf9475" opacity="0.2"/>
      <path d="M 131 86 C 130 106 122 123 102 133 C 114 125 124 108 126 88 Z" fill="#cf9475" opacity="0.2"/>

      <!-- Eyebrows (Elegantly Arched & Expressive, Animatable) -->
      <g id="avatar-eyebrows" class="avatar-eyebrows">
        <!-- Left Brow -->
        <path id="avatar-left-brow" class="avatar-brow" d="M 76 77 C 82 72 90 73 95 78" stroke="#382519" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <!-- Right Brow -->
        <path id="avatar-right-brow" class="avatar-brow" d="M 105 78 C 110 73 118 72 124 77" stroke="#382519" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Eyes (Almond Shape with Upper Lash Definition, Blinking Target) -->
      <g class="avatar-eyes">
        <!-- Left Eye Group -->
        <g id="avatar-left-eye" class="avatar-eye" transform-origin="85 91">
          <!-- Eye White -->
          <path d="M 77 91 C 79 87 91 87 93 91 C 91 95 79 95 77 91 Z" fill="#f8fafc"/>
          <!-- Iris (Warm Amber / Espresso) -->
          <circle cx="85" cy="91" r="3.6" fill="#2d1e15"/>
          <circle cx="85" cy="91" r="2" fill="#170f0a"/>
          <!-- Catchlight -->
          <circle cx="86.2" cy="89.8" r="1.1" fill="#ffffff"/>
          <!-- Eyeliner & Lash Accent -->
          <path d="M 75.5 91 C 79 86 91 86 94.5 90" stroke="#1c120c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M 76 88.5 C 80 85.5 90 85.5 94 88.5" stroke="#cf9475" stroke-width="0.8" fill="none" opacity="0.6"/>
        </g>

        <!-- Right Eye Group -->
        <g id="avatar-right-eye" class="avatar-eye" transform-origin="115 91">
          <!-- Eye White -->
          <path d="M 107 91 C 109 87 121 87 123 91 C 121 95 109 95 107 91 Z" fill="#f8fafc"/>
          <!-- Iris -->
          <circle cx="115" cy="91" r="3.6" fill="#2d1e15"/>
          <circle cx="115" cy="91" r="2" fill="#170f0a"/>
          <!-- Catchlight -->
          <circle cx="116.2" cy="89.8" r="1.1" fill="#ffffff"/>
          <!-- Eyeliner & Lash Accent -->
          <path d="M 105.5 90 C 109 86 121 86 124.5 91" stroke="#1c120c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M 106 88.5 C 110 85.5 120 85.5 124 88.5" stroke="#cf9475" stroke-width="0.8" fill="none" opacity="0.6"/>
        </g>
      </g>

      <!-- Sculpted Nose Bridge & Subtle Nostrils -->
      <g class="avatar-nose">
        <path d="M 98 80 L 98 103 L 95 106 L 100 107 L 105 106 L 102 103" stroke="#cf9475" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <ellipse cx="95" cy="106" rx="1.6" ry="0.9" fill="#b97c5c" opacity="0.35"/>
        <ellipse cx="105" cy="106" rx="1.6" ry="0.9" fill="#b97c5c" opacity="0.35"/>
        <line x1="99" y1="83" x2="99" y2="102" stroke="#fff" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
      </g>

      <!-- Philtrum -->
      <path d="M 98.5 110 L 98.5 114 M 101.5 110 L 101.5 114" stroke="#e0a789" stroke-width="0.7" opacity="0.4"/>

      <!-- Animatable Mouth (Morphing Lip-Sync Path) -->
      <!-- Closed State: M 88 120 Q 100 124 112 120 -->
      <g id="avatar-mouth-group" class="avatar-mouth-group">
        <!-- Upper Lip Contour -->
        <path d="M 91 119 Q 96 117.5 100 119 Q 104 117.5 109 119" stroke="#be123c" stroke-width="1" fill="none" opacity="0.7"/>
        <!-- Main Morphing Path -->
        <path id="avatar-mouth" class="avatar-mouth" d="M 88 120 Q 100 124 112 120" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="#be123c"/>
        <!-- Lower Lip Subtle Definition -->
        <path d="M 93 125 Q 100 127 107 125" stroke="#e0a789" stroke-width="1.1" fill="none" opacity="0.5"/>
      </g>

      <!-- Front Styled Hair & Side-Parted Framing Layers -->
      <g class="avatar-hair">
        <!-- Side Framing Layers -->
        <path d="M 68 76 C 64 64 65 52 70 42 C 78 32 94 32 100 32 C 116 32 128 36 134 46 C 137 54 136 66 134 76 C 130 60 126 52 118 46 C 110 42 90 42 80 48 C 74 54 70 64 68 76 Z" fill="url(#femHairGrad)"/>
        
        <!-- Elegant Side-Parted Crown & Fringe -->
        <path d="M 64 56 C 62 38 76 26 100 24 C 122 22 138 32 140 50 C 132 36 118 30 102 32 C 86 34 74 42 64 56 Z" fill="url(#femHairGrad)"/>
        
        <!-- Hair Layering Highlights & Silken Strands -->
        <path d="M 72 44 C 86 32 116 32 132 40 C 120 34 94 34 80 44 Z" fill="url(#femHairHighlight)"/>
        <path d="M 70 50 C 80 38 100 36 122 40" stroke="#6b4c38" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.45"/>
        <path d="M 66 64 C 64 80 66 100 70 114 C 68 98 67 82 68 64 Z" fill="#2d1e15" opacity="0.5"/>
      </g>

    </g> <!-- end avatar-head -->
  </g> <!-- end avatar-character-body -->
</svg>
