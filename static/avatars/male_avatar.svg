<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" id="male-avatar-svg" class="corporate-avatar-svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="maleBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Skin Base & Shading -->
    <linearGradient id="maleSkinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fae3d1"/>
      <stop offset="45%" stop-color="#f2cbb2"/>
      <stop offset="100%" stop-color="#dfa787"/>
    </linearGradient>
    <linearGradient id="maleNeckShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c68a65"/>
      <stop offset="100%" stop-color="#dfa787"/>
    </linearGradient>

    <!-- Hair Tone & Highlights -->
    <linearGradient id="maleHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="50%" stop-color="#242933"/>
      <stop offset="100%" stop-color="#191c24"/>
    </linearGradient>
    <linearGradient id="maleHairHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c566a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4c566a" stop-opacity="0"/>
    </linearGradient>

    <!-- Suit & Attire -->
    <linearGradient id="maleSuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="maleTieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="maleCollarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadow Filter -->
    <filter id="avatarDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="200" height="240" rx="16" fill="url(#maleBgGrad)"/>
  
  <!-- Subtle Studio Rim Light Glow -->
  <circle cx="100" cy="90" r="85" fill="#6366f1" opacity="0.08"/>

  <!-- Entire Character Group (for breathing respiration) -->
  <g id="avatar-character-body" class="avatar-character-body">

    <!-- Shoulders & Tailored Suit Jacket -->
    <g class="avatar-attire">
      <!-- Suit Back / Shoulder Base -->
      <path d="M 22 240 L 32 195 C 38 172 58 162 82 160 L 118 160 C 142 162 162 172 168 195 L 178 240 Z" fill="url(#maleSuitGrad)"/>
      
      <!-- Crisp Shirt & Inner Collar -->
      <polygon points="86,160 100,186 114,160 108,160 100,172 92,160" fill="url(#maleCollarGrad)"/>
      <polygon points="82,160 96,176 100,166 88,156" fill="#f8fafc"/>
      <polygon points="118,160 104,176 100,166 112,156" fill="#f1f5f9"/>

      <!-- Silk Tie with Dimensional Knot -->
      <!-- Knot -->
      <polygon points="95,170 105,170 107,180 93,180" fill="url(#maleTieGrad)"/>
      <!-- Tie Body -->
      <path d="M 94 180 L 106 180 L 109 232 L 100 240 L 91 232 Z" fill="url(#maleTieGrad)"/>
      <line x1="97" y1="180" x2="99" y2="236" stroke="#818cf8" stroke-width="0.75" opacity="0.4"/>

      <!-- Jacket Lapels -->
      <!-- Left Lapel -->
      <path d="M 44 240 L 62 188 C 66 176 76 168 88 166 L 94 188 L 76 240 Z" fill="#293548"/>
      <!-- Right Lapel -->
      <path d="M 156 240 L 138 188 C 134 176 124 168 112 166 L 106 188 L 124 240 Z" fill="#1e2738"/>
      
      <!-- Lapel Seam Line Accent -->
      <path d="M 88 166 L 94 188 L 76 240" stroke="#475569" stroke-width="0.75" fill="none" opacity="0.5"/>
      <path d="M 112 166 L 106 188 L 124 240" stroke="#475569" stroke-width="0.75" fill="none" opacity="0.5"/>
    </g>

    <!-- Head & Facial Features Group (for head tilt / micro-nodding) -->
    <g id="avatar-head" class="avatar-head" transform-origin="100 120">

      <!-- Neck & Anatomical Shading -->
      <path d="M 86 130 L 86 162 C 90 166 110 166 114 162 L 114 130 Z" fill="url(#maleNeckShadow)"/>
      <!-- Under-Jaw Cast Shadow -->
      <path d="M 86 130 C 92 144 108 144 114 130 C 110 148 90 148 86 130 Z" fill="#b87852" opacity="0.5"/>

      <!-- Ears with Anatomical Helix -->
      <!-- Left Ear -->
      <path d="M 64 96 C 58 96 58 114 65 116 C 66 110 66 102 64 96 Z" fill="#dfa787"/>
      <path d="M 63 100 C 60 102 61 110 64 111" stroke="#b87852" stroke-width="1.2" fill="none"/>
      <!-- Right Ear -->
      <path d="M 136 96 C 142 96 142 114 135 116 C 134 110 134 102 136 96 Z" fill="#dfa787"/>
      <path d="M 137 100 C 140 102 139 110 136 111" stroke="#b87852" stroke-width="1.2" fill="none"/>

      <!-- Face / Head Structure (Realistic Jawline & Proportions) -->
      <path d="M 66 84 C 66 52 80 44 100 44 C 120 44 134 52 134 84 C 134 108 126 136 100 136 C 74 136 66 108 66 84 Z" fill="url(#maleSkinGrad)" filter="url(#avatarDropShadow)"/>

      <!-- Subtle Cheek & Temple Contouring -->
      <path d="M 67 86 C 68 106 76 124 96 134 C 84 126 73 108 72 88 Z" fill="#caa084" opacity="0.25"/>
      <path d="M 133 86 C 132 106 124 124 104 134 C 116 126 127 108 128 88 Z" fill="#caa084" opacity="0.25"/>

      <!-- Eyebrows (Realistic Natural Arc, Animatable) -->
      <g id="avatar-eyebrows" class="avatar-eyebrows">
        <!-- Left Brow -->
        <path id="avatar-left-brow" class="avatar-brow" d="M 76 78 C 82 74 90 75 94 79" stroke="#242933" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- Right Brow -->
        <path id="avatar-right-brow" class="avatar-brow" d="M 106 79 C 110 75 118 74 124 78" stroke="#242933" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Eyes (Realistic Almond Proportions, Blinking Target) -->
      <g class="avatar-eyes">
        <!-- Left Eye Group -->
        <g id="avatar-left-eye" class="avatar-eye" transform-origin="85 91">
          <!-- Eye White -->
          <path d="M 77 91 C 79 87 91 87 93 91 C 91 95 79 95 77 91 Z" fill="#f8fafc"/>
          <!-- Iris (Navy/Slate Professional Iris) -->
          <circle cx="85" cy="91" r="3.6" fill="#1e293b"/>
          <circle cx="85" cy="91" r="2" fill="#0f172a"/>
          <!-- Catchlight Highlight -->
          <circle cx="86.2" cy="89.8" r="1.1" fill="#ffffff"/>
          <!-- Upper Eyelid Crease -->
          <path d="M 76 89 C 80 86 90 86 94 89" stroke="#b87852" stroke-width="1" fill="none" opacity="0.6"/>
        </g>

        <!-- Right Eye Group -->
        <g id="avatar-right-eye" class="avatar-eye" transform-origin="115 91">
          <!-- Eye White -->
          <path d="M 107 91 C 109 87 121 87 123 91 C 121 95 109 95 107 91 Z" fill="#f8fafc"/>
          <!-- Iris -->
          <circle cx="115" cy="91" r="3.6" fill="#1e293b"/>
          <circle cx="115" cy="91" r="2" fill="#0f172a"/>
          <!-- Catchlight Highlight -->
          <circle cx="116.2" cy="89.8" r="1.1" fill="#ffffff"/>
          <!-- Upper Eyelid Crease -->
          <path d="M 106 89 C 110 86 120 86 124 89" stroke="#b87852" stroke-width="1" fill="none" opacity="0.6"/>
        </g>
      </g>

      <!-- Sculpted Nose Bridge & Nostril Contour -->
      <g class="avatar-nose">
        <path d="M 98 80 L 97 104 L 94 107 L 100 108 L 106 107 L 103 104" stroke="#c68a65" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <ellipse cx="94" cy="107" rx="1.8" ry="1" fill="#b87852" opacity="0.4"/>
        <ellipse cx="106" cy="107" rx="1.8" ry="1" fill="#b87852" opacity="0.4"/>
        <!-- Soft Nose Bridge Highlight -->
        <line x1="99" y1="83" x2="99" y2="103" stroke="#fff" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
      </g>

      <!-- Philtrum Indentation -->
      <path d="M 98 111 L 98 115 M 102 111 L 102 115" stroke="#caa084" stroke-width="0.8" opacity="0.4"/>

      <!-- Animatable Mouth (Morphing Lip-Sync Path) -->
      <!-- Closed State: M 88 121 Q 100 125 112 121 -->
      <g id="avatar-mouth-group" class="avatar-mouth-group">
        <!-- Upper Lip Accent -->
        <path d="M 92 120 Q 97 119 100 120 Q 103 119 108 120" stroke="#b46d50" stroke-width="0.9" fill="none" opacity="0.6"/>
        <!-- Main Morphing Path -->
        <path id="avatar-mouth" class="avatar-mouth" d="M 88 121 Q 100 125 112 121" stroke="#964b38" stroke-width="2.6" stroke-linecap="round" fill="#964b38"/>
        <!-- Lower Lip Shadow -->
        <path d="M 94 126 Q 100 128 106 126" stroke="#caa084" stroke-width="1.2" fill="none" opacity="0.5"/>
      </g>

      <!-- Hair Base & Modern Professional Styling -->
      <g class="avatar-hair">
        <!-- Sideburns & Temples -->
        <path d="M 66 78 C 64 68 64 56 70 46 C 78 35 94 36 100 36 C 114 36 128 38 134 50 C 137 56 136 68 134 78 C 132 72 130 68 126 62 C 120 54 110 50 98 50 C 84 50 74 56 70 64 C 68 70 67 74 66 78 Z" fill="url(#maleHairGrad)"/>
        
        <!-- Styled Volume Top & Parting -->
        <path d="M 64 60 C 62 42 74 30 96 28 C 118 26 136 34 138 52 C 132 40 120 35 104 36 C 88 37 74 44 64 60 Z" fill="url(#maleHairGrad)"/>
        
        <!-- Hair Fringe Swoop / Layering Highlight -->
        <path d="M 72 48 C 84 36 112 36 128 44 C 116 38 92 38 78 48 Z" fill="url(#maleHairHighlight)"/>
        <path d="M 68 54 C 76 44 94 42 110 46" stroke="#475569" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
      </g>

    </g> <!-- end avatar-head -->
  </g> <!-- end avatar-character-body -->
</svg>
