<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="InterviewCoach AI - Intelligent Interview Preparation Platform">
    <title>{% block title %}InterviewCoach AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <a href="{{ url_for('main.index') }}" class="brand-logo">
                <div class="brand-icon">IC</div>
                <span>InterviewCoach AI</span>
            </a>
            <nav class="nav-links">
                <div class="status-badge" id="health-badge">
                    <span class="status-dot"></span>
                    <span id="status-text">Module 1 Active</span>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 InterviewCoach AI. Modular Architecture Foundation.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
